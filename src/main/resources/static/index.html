<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskBoard</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
<header class="top">
    <h1>TaskBoard</h1>
    <div class="server">
        <span id="server-status" class="status">Checking the server...</span>
        <button id="check-button" type="button">Check again</button>
    </div>
</header>

<form id="task-form" class="task-form">
    <input id="task-title" name="title" type="text" placeholder="What needs to be done?"
           maxlength="100" required autocomplete="off">
    <button type="submit">Add task</button>
    <span id="form-error" class="form-error" hidden></span>
</form>

<div id="board-message" class="message" hidden>
    <span id="board-message-text"></span>
    <button id="board-message-close" type="button" title="Close">✕</button>
</div>

<main class="board">
    <section class="column" data-status="TODO">
        <h2>To Do <span class="count">0</span></h2>
       <div class="cards"></div>
    </section>
    <section class="column" data-status="IN_PROGRESS">
        <h2>In Progress <span class="count">0</span></h2>
        <div class="cards"></div>
    </section>
    <section class="column" data-status="DONE">
        <h2>Done <span class="count">0</span></h2>
        <div class="cards"></div>
    </section>
</main>
</body>
</html>
