<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskBoard</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
<header class="top">
    <h1>TaskBoard</h1>
    <div class="server">
        <span id="server-status" class="status">Checking the server...</span>
        <button id="check-button" type="button">Check again</button>
    </div>
</header>

<main class="board">
    <section class="column">
        <h2>To Do</h2>
        <p class="empty">No tasks yet</p>
    </section>
    <section class="column">
        <h2>In Progress</h2>
        <p class="empty">No tasks yet</p>
    </section>
    <section class="column">
        <h2>Done</h2>
        <p class="empty">No tasks yet</p>
    </section>
</main>
</body>
</html>
